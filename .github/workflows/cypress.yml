name: Pruebas Cypress

# Se ejecuta en cada push y en cada pull request
on:
  push:
  pull_request:

jobs:
  cypress:
    name: Pruebas E2E con Cypress
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (incluye Cypress)
        run: npm ci

      - name: Verificar Cypress
        run: npx cypress verify

      # Levanta la app en el puerto 3000, espera a que responda,
      # corre toda la suite de Cypress y apaga la app al terminar
      - name: Ejecutar pruebas Cypress
        run: npm test

      # Sube video, capturas y reporte SIEMPRE (también si las pruebas fallan)
      - name: Subir videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-capturas
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Subir reporte mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mochawesome
          path: cypress/reports
          if-no-files-found: ignore
